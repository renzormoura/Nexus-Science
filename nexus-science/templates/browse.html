<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Encontre, entenda e organize artigos científicos: busca com filtros, versão aberta, citações e listas de leitura.">
  <title>Nexus Science — navegador de artigos</title>
  <link rel="icon" href="/static/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/browse.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/brand.css?v={{ asset_version }}">
  <script src="/static/browse-lib.js?v={{ asset_version }}" defer></script>
  <script src="/static/fx.js?v={{ asset_version }}" defer></script>
  <script src="/static/browse.js?v={{ asset_version }}" defer></script>
</head>
<body>
  {% include "_icons.html" %}
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Nexus Science — início">
      <img class="brand-logo logo-dark" src="/static/logo-escuro.png" alt="Nexus Science" width="137" height="35"><img class="brand-logo logo-light" src="/static/logo-claro.png" alt="" width="137" height="35" aria-hidden="true">
    </a>
    <nav class="mainnav" id="mainnav" aria-label="Principal"></nav>
    <div class="topbar-actions">
      <div class="bell-wrap" id="bell-wrap" hidden>
        <button type="button" class="btn btn-ghost" id="bell-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="alerts-panel" aria-label="Avisos de artigos novos"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg><span class="bell-count" id="bell-count" hidden></span></button>
        <section class="alerts-panel" id="alerts-panel" role="dialog" aria-label="Avisos de artigos novos" hidden></section>
      </div>
      <button type="button" class="btn btn-ghost" id="palette-button" aria-label="Abrir a paleta de comandos (Ctrl K)" title="Comandos (Ctrl K)"><svg class="icon" aria-hidden="true"><use href="#i-spark"/></svg><span class="btn-label">Comandos</span></button>
      <button type="button" class="btn btn-ghost" id="theme-toggle" aria-label="Alternar tema claro ou escuro"><svg class="icon" aria-hidden="true"><use href="#i-theme"/></svg><span class="btn-label" id="theme-label">Tema</span></button>
      <button type="button" class="btn btn-ghost" id="account-button" data-user="{{ user or '' }}" data-name="{{ name or '' }}" data-profile="{{ profile }}" data-health-pack="{{ health_pack }}"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg><span class="btn-label" id="account-label">{{ user or "Entrar" }}</span></button>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <dialog id="auth-dialog" aria-labelledby="auth-title">
    <form method="dialog" id="auth-form" class="auth-card">
      <h2 id="auth-title">Conta</h2>
      <p class="hint" id="auth-hint">Entre para salvar artigos, criar listas e exportar. Buscar e ler não exige conta.</p>
      <div class="field" id="auth-name-field" hidden><label for="auth-name">Como podemos te chamar?</label>
        <input type="text" id="auth-name" autocomplete="given-name" maxlength="60"></div>
      <div class="field"><label for="auth-email">E-mail</label>
        <input type="email" id="auth-email" autocomplete="email" maxlength="320" required></div>
      <div class="field"><label for="auth-password">Senha</label>
        <input type="password" id="auth-password" autocomplete="current-password" minlength="8" maxlength="128" required></div>
      <label class="check auth-terms"><input type="checkbox" id="auth-terms"> Li e aceito os <a href="#/termos" data-close-auth>Termos de Uso</a> e a <a href="#/privacidade" data-close-auth>Política de Privacidade</a> (necessário para criar a conta)</label>
      <p class="auth-error" id="auth-error" role="alert" hidden></p>
      <p class="hint" id="auth-note" role="status" hidden></p>
      <div class="row">
        <button type="button" class="btn btn-primary" data-auth="login">Entrar</button>
        <button type="button" class="btn btn-secondary" data-auth="register">Criar conta</button>
        <button type="button" class="btn btn-ghost" data-auth="cancel">Cancelar</button>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" data-auth="forgot">Esqueci a senha</button>
      <a class="btn btn-outline" id="profile-link" href="#/perfil" hidden>Meu perfil</a>
      <a class="btn btn-outline" id="admin-link" href="#/admin" hidden>Administração</a>
      <button type="button" class="btn btn-outline" id="logout-button" hidden>Sair da conta</button>
    </form>
  </dialog>

  {% include "_footer.html" %}
  <nav class="bottom-nav" id="bottomnav" aria-label="Navegação principal"></nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
